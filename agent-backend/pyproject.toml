[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "agent-backend"
version = "1.0.0"
description = "Open source Agent framework built on Aliyun PAI"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11.0,<3.12"
fastapi = "0.115.2"
uvicorn = "^0.29.0"
tenacity = "9.1.2"
openai = "^1.78.1"
mcp = "^1.8.1"
pre-commit = "^4.2.0"
llama-index = "^0.12.36"
llama-index-tools-mcp = "^0.1.3"
loguru = "^0.7.3"
alibabacloud-tea-openapi = "^0.3.15"
alibabacloud-iqs20241111 = "^1.3.0"
openinference-instrumentation-llama-index = "^4.0.0"
openinference-instrumentation-openai = "0.1.28"
grpcio = "^1.73.0"
protobuf = "5.29.5"
opentelemetry-exporter-otlp-proto-grpc = "1.34.0"
