<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAI-RAG Home</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background-color: #f9f9f9;
      }

      header {
        background-color: #4caf50;
        color: white;
        padding: 10px 0;
        text-align: center;
      }

      .container {
        width: 80%;
        margin: auto;
        overflow: hidden;
      }

      h1 {
        font-size: 2.5em;
      }

      #logo {
        width: 150px; /* Adjust as necessary */
        margin-top: 20px;
      }

      .arts-section {
        margin: 20px 0;
      }

      footer {
        text-align: center;
        padding: 20px 0;
        background-color: #333;
        color: white;
        position: relative;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="container">
        <img src="path/to/your/logo.png" alt="PAI-RAG Logo" id="logo" />
        <h1>Welcome to PAI-RAG</h1>
      </div>
    </header>

    <div class="container">
      <section class="arts-section">
        <p>Stay tuned for exciting features!</p>
      </section>
    </div>

    <footer>
      <p>&copy; 2025 PAI-RAG. All rights reserved.</p>
    </footer>
  </body>
</html>
