[tool.poetry.scripts]
load_data = "pai_rag.tools.load_data_tool:run"
load_model = "pai_rag.utils.download_models:load_models"
run_eval_exp = "pai_rag.evaluation.run_evaluation_experiments:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
