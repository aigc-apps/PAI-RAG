llama-index-vector-stores-elasticsearch = "^0.4.0"
llama-index-vector-stores-milvus = "0.8.1"
llama-index-embeddings-huggingface = "0.5.4"
llama-index-vector-stores-alibabacloud-opensearch = "^0.3.0"
pydantic = "^2.7.0"
pytest = "^8.1.1"
flagembedding = "^1.2.10"
sentencepiece = "^0.2.0"
oss2 = "^2.18.5"
asgi-correlation-id = "^4.3.1"
torch = "^2.6.0"
torchvision = "^0.21.0"
transformers = "4.51.3"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
gunicorn = "^22.0.0"
modelscope = "^1.16.0"
asyncpg = "^0.29.0"
pgvector = "^0.3.2"
pre-commit = "^3.8.0"
bs4 = "^0.0.2"
httpx = "^0.28.1"
peft = "^0.12.0"
anyio = "^4.6.2.post1"
sqlparse = "^0.5.3"
