llama-index-embeddings-openai-like = "^0.2.2"
llama-index-llms-openai = "^0.6.10"
llama-index-llms-openai-like = "^0.5.3"
llama-index-vector-stores-analyticdb = "^0.4.1"
llama-index-vector-stores-elasticsearch = "^0.5.1"
llama-index-vector-stores-milvus = "0.9.4"
llama-index-vector-stores-alibabacloud-opensearch = "^0.4.1"
llama-index-vector-stores-hologres = "^0.4.1"
llama-index-vector-stores-tablestore = "^0.3.1"
llama-index-vector-stores-postgres = "^0.7.2"
pydantic = "^2.7.0"
pytest = "^8.1.1"
flagembedding = "^1.2.10"
sentencepiece = "^0.2.0"
alibabacloud-oss-v2 = "^1.2.5"
asgi-correlation-id = "^4.3.1"
torch = "^2.6.0"
torchvision = "^0.21.0"
transformers = "4.51.3"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
