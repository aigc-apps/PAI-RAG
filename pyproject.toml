[project]
name = "pairag"
version = "2.0.0"
requires-python = ">=3.11,<3.13"

[tool.poetry]
name = "pairag"
version = "2.0.0"
description = "A short description of your project"
authors = ["Your Name <you@example.com>"]
packages = [
  {include = "db", from = "backend"},
  {include = "rag", from = "backend"},
  {include = "app", from = "backend"},
  {include = "api", from = "backend"},
  {include = "config", from = "backend"},
  {include = "common", from = "backend"},
  {include = "extensions", from = "backend"},
  {include = "memory", from = "backend"},
  {include = "chat", from = "backend"}
]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.13"
fastapi = "0.115.2"
