[project]
name = "pairag"
version = "2.0.0"
requires-python = ">=3.11,<3.13"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:"
]

[tool.coverage.run]
source = ["backend"]
omit = [
  "backend/**/migrations/*",
  "backend/**/__main__.py",
  "backend/app/*",
  "backend/common/llm/openai/*",
  "backend/service/injection.py"
]

[tool.poetry]
name = "pairag"
version = "2.0.0"
description = "A short description of your project"
authors = ["Your Name <you@example.com>"]
packages = [
  {include = "db", from = "backend"},
  {include = "rag", from = "backend"},
  {include = "app", from = "backend"},
  {include = "api", from = "backend"},
  {include = "common", from = "backend"},
  {include = "extensions", from = "backend"},
  {include = "memory", from = "backend"},
  {include = "service", from = "backend"},
  {include = "tools", from = "backend"},
  {include = "evaluation", from = "backend"},
  {include = "utils", from = "backend"}
]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.13"
fastapi = "0.115.2"
uvicorn = "^0.31.1"
llama-index-core = "^0.14.8"
