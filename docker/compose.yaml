services:
  api:
    image: mybigpai-public-registry.cn-beijing.cr.aliyuncs.com/mybigpai/pairag:2.0.0
    ports:
      - "8680:8680"
    restart: always
    environment:
      FILE_STORE_TYPE: ${FILE_STORE_TYPE}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_TYPE: ${DB_TYPE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      VECTOR_DB_TYPE: ${VECTOR_DB_TYPE}
      MILVUS_HOST: ${MILVUS_HOST}
      MILVUS_PORT: ${MILVUS_PORT}
      MILVUS_USER: ${MILVUS_USER}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD}
      MILVUS_DATABASE: ${MILVUS_DATABASE}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      ELASTICSEARCH_USER: ${ELASTICSEARCH_USER}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}

    volumes:
      - ../localdata:/app/localdata
    entrypoint: ["./scripts/start.sh", "--production"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8680/v1/health"]
      interval: 30s
      retries: 40
      start_period: 20s
