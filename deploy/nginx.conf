# PAI-Loop combined image — nginx vhost.
# Serves the SPA and reverse-proxies the API to the backend on the loopback.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Knowledge-base file uploads can be large.
    client_max_body_size 100m;

    # Single-page app: hand every non-file route back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + streaming (SSE) — proxied to uvicorn in the same container.
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events / token streaming: disable buffering so chunks
        # flush immediately, and allow long-lived connections.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        chunked_transfer_encoding  on;
    }
}
