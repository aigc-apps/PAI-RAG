[dependency-groups]
dev = [
  "pytest>=8.0"
]

[project]
name = "backend"
version = "0.1.0"
description = "Lean agent service — the clean base for PAI-Loop's agent core."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=2.0",
  "httpx>=0.27",
  "loguru>=0.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0", # [asyncio] pulls greenlet, required by aiosqlite/sqlmodel async
  "aiosqlite>=0.20",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "tenacity>=8.0",
  "pyjwt>=2.13.0",
  "argon2-cffi>=25.1.0",
  "elasticsearch>=8,<9",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "aiohttp>=3.14.1",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "openinference-instrumentation-openai>=0.1.20"
]

[project.optional-dependencies]
# File-upload parsers for the knowledge base. Kept OUT of the lean base: default
# `uv sync` skips them, so pdf/docx/pptx/xlsx/etc. ingestion needs
# `uv sync --extra parsers`. markitdown is imported lazily (never at module top)
# so the service boots — and .txt/.md uploads work — without this extra.
parsers = ["markitdown[pdf,docx,pptx,xlsx]>=0.1"]

[tool.pytest]

[tool.pytest.ini_options]
# Flat layout: the packages (app/, agent/, api/, common/, memory/, utils/) live at the
# project root, so add it to sys.path for imports during tests.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["postgres: opt-in tests requiring PAIRAG_TEST_POSTGRES_URL"]

# This is a runnable service, not a distributable package — uv manages the env only.
[tool.uv]
package = false
