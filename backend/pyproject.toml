[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pairag"
version = "2.0.0"
description = "Open source RAG framework built on Aliyun PAI"
authors = []
readme = "README.md"
packages = [
  {include = "api", from = "backend"},
  {include = "app", from = "backend"},
  {include = "chat", from = "backend"},
  {include = "common", from = "backend"},
  {include = "config", from = "backend"},
  {include = "db", from = "backend"},
  {include = "extensions", from = "backend"},
  {include = "memory", from = "backend"},
  {include = "rag", from = "backend"},
  {include = "tools", from = "backend"},
  {include = "utils", from = "backend"}
]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.12"
fastapi = "0.115.2"
uvicorn = "^0.29.0"
llama-index-core = "^0.12.12"
llama-index-llms-openai = "^0.3.0"
llama-index-vector-stores-analyticdb = "^0.3.0"
llama-index-vector-stores-elasticsearch = "^0.4.0"
llama-index-vector-stores-milvus = "0.8.1"
llama-index-embeddings-huggingface = "^0.4.0"
llama-index-multi-modal-llms-openai = "^0.5.0"
llama-index-vector-stores-alibabacloud-opensearch = "^0.3.0"
pydantic = "^2.7.0"
pytest = "^8.1.1"
flagembedding = "^1.2.10"
sentencepiece = "^0.2.0"
oss2 = "^2.18.5"
asgi-correlation-id = "^4.3.1"
openinference-instrumentation-llama-index = "^4.2.1"
torch = "2.2.2"
torchvision = "0.17.2"
transformers = "4.51.3"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
gunicorn = "^22.0.0"
modelscope = "^1.16.0"
asyncpg = "^0.29.0"
pgvector = "^0.3.2"
pre-commit = "^3.8.0"
bs4 = "^0.0.2"
httpx = "0.27.0"
peft = "^0.12.0"
anyio = "^4.6.2.post1"
sqlparse = "^0.5.3"
func-timeout = "^4.3.5"
dashtext = "^0.0.7"
alibabacloud-iqs20241111 = "1.1.3"
alibabacloud-green20220302 = "^2.2.8"
serpapi = "^0.1.5"
alibabacloud-tea-openapi-sse = "^1.0.2"
llama-index-vector-stores-hologres = "^0.3.0"
pymilvus = "2.5.7"
numpy = "1.26.4"
loguru = "^0.7.3"
llama-index-vector-stores-tablestore = "^0.2.2"
llama-index-vector-stores-dashvector = "^0.3.0"
opentelemetry-sdk = "^1.33.1"
sqlmodel = "^0.0.24"
mcp = "^1.9.3"
llama-index-tools-mcp = "^0.2.5"
openinference-instrumentation-openai = "^0.1.30"
aiosqlite = "^0.21.0"
alembic = "^1.16.2"
llama-index-embeddings-openai-like = "^0.1.1"
pymupdf4llm = "0.0.17"
celery = "^5.5.3"
dashvector = {url = "https://pai-rag.oss-cn-hangzhou.aliyuncs.com/packages/python_wheels/dashvector-1.0.19.1-py3-none-any.whl"}
chromadb = "^1.0.15"
llama-index-vector-stores-postgres = "^0.5.4"

[tool.pytest.ini_options]
asyncio_mode = "auto"
