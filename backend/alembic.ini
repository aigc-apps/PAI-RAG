# Alembic config. The database URL is intentionally NOT set here — env.py reads
# it from the app settings (DB_URL env var), so the CLI and the running app
# always migrate the same database. Point the CLI at this file from backend/:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe change"
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Store revision timestamps in UTC and prefix filenames with them for ordering.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
