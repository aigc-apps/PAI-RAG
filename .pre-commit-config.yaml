---
default_language_version:
  python: python3

exclude: tests/testdata
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-byte-order-marker
        files: ^backend/
      - id: check-merge-conflict
        files: ^backend/
      - id: check-symlinks
        files: ^backend/
      - id: check-toml
        files: ^backend/
      - id: check-yaml
        files: ^backend/
      - id: detect-private-key
        files: ^backend/
      - id: end-of-file-fixer
        files: ^backend/
      - id: mixed-line-ending
        files: ^backend/
      - id: trailing-whitespace
        files: ^backend/
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.5

    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
        exclude: ".*poetry.lock|.*_static|.*__init__.py|.*app.py|.*worker.py|.*main.py|tests/app/|alembic/"
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.0.1
    hooks:
      - id: mypy
        files: ^backend/
        additional_dependencies:
          [
            "types-requests",
            "types-Deprecated",
            "types-redis",
            "types-setuptools",
            "types-PyYAML",
            "types-protobuf==4.24.0.4",
          ]
        args:
          [
            --namespace-packages,
            --explicit-package-bases,
            --disallow-untyped-defs,
            --ignore-missing-imports,
            --python-version=3.8,
          ]
        entry: bash -c "export MYPYPATH=PAI-RAG"
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 23.10.1
    hooks:
      - id: black-jupyter
        name: black-docs-py
        alias: black
        files: ^(backend\.*\.ipynb$)
        # Using PEP 8's line length in docs prevents excess left/right scrolling
        args: [--line-length=79]
  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.16.0
    hooks:
      - id: blacken-docs
        name: black-docs-text
        alias: black
        types_or: [rst, markdown, tex]
        additional_dependencies: [black==23.10.1]
        # Using PEP 8's line length in docs prevents excess left/right scrolling
        args: [--line-length=79]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        files: ^backend/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        exclude: |
          poetry.lock|
          (\/.*?\.[\w:]+)/pyproject.toml|
          (\/.*?\.[\w:]+)/poetry.lock|
        args:
          [
            "--skip",
            "*.json,*.txt,*.jsonl",
            "--ignore-words-list",
            "astroid,gallary,momento,narl,ot,rouge,nin,gere",
          ]
  - repo: https://github.com/srstevenson/nb-clean
    rev: 3.1.0
    hooks:
      - id: nb-clean
        args: [--preserve-cell-outputs, --remove-empty-cells]
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.23.1
    hooks:
      - id: toml-sort-fix
        exclude: ".*poetry.lock|.*_static"
