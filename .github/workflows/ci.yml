name: PAI-RAG CI Build

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - main
      - feature
      - "releases/**"

concurrency:
  group: pairag-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v5
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: "3.11"
          # Optional - x64 or x86 architecture, defaults to x64
          architecture: "x64"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install poetry
          poetry install
          poetry run pip install magic-pdf[full]==1.3.10 dashvector==1.0.19
          poetry run pip install protobuf==5.27.4
        env:
          POETRY_VIRTUALENVS_CREATE: false

      - name: Install pre-commit
        shell: bash
        run: poetry run pip install pre-commit

      - name: Run Linter
        shell: bash
        run: poetry run make lint

      - name: Run Tests
        run: |
          make coveragetest
        env:
          DASHSCOPE_API_KEY: ${{ secrets.TESTDASHSCOPEKEY }}
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
          IS_PAI_RAG_CI_TEST: true
          PAIRAG_RAG__embedding__source: "huggingface"
          PAIRAG_RAG__llm__source: "DashScope"
          PAIRAG_RAG__llm__model: "qwen-max"
