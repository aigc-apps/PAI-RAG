name: Publish Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  workflow_dispatch:
  push:
    branches: ["feature"]

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ${{ secrets.BUILD_ACR_URL }}
  TEST_REGISTRY: registry.cn-hangzhou.aliyuncs.com

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: df . -h

      - name: Extract version
        run: |
          pip install poetry
          VERSION_TAG=$(poetry version --short)
          CURRENT_TIME="`date +%Y%m%d%H%M%S`"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "TIME_VERSION_TAG=$VERSION_TAG-$CURRENT_TIME" >> $GITHUB_ENV

      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Login to ACR Beijing region
        uses: docker/login-action@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to ACR Hangzhou region
        uses: docker/login-action@v1
        with:
          registry: ${{ env.TEST_REGISTRY }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push base image
        env:
          IMAGE_TAG: ${{env.VERSION_TAG}}
          TEST_IMAGE_TAG: ${{env.TIME_VERSION_TAG}}
        run: |
          docker build -t ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG .
          docker push ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG
          docker tag ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG ${{ env.TEST_REGISTRY }}/mybigpai/pai-rag:$TEST_IMAGE_TAG
          docker push ${{ env.TEST_REGISTRY }}/mybigpai/pai-rag:$TEST_IMAGE_TAG

      - name: Build and push GPU image
        env:
          IMAGE_TAG: ${{env.VERSION_TAG}}-gpu
          TEST_IMAGE_TAG: ${{env.TIME_VERSION_TAG}}-gpu
        run: |
          docker build -t ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG -f Dockerfile_gpu .
          docker push ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG
          docker tag ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG ${{ env.TEST_REGISTRY }}/mybigpai/pai-rag:$TEST_IMAGE_TAG
          docker push ${{ env.TEST_REGISTRY }}/mybigpai/pai-rag:$TEST_IMAGE_TAG

      - name: Build and push base data process image
        env:
          IMAGE_TAG: ${{env.VERSION_TAG}}-rag-data-operator
          TEST_IMAGE_TAG: ${{env.TIME_VERSION_TAG}}-rag-data-operator
        run: |
          docker build -t ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG -f src/pai_rag/tools/data_process/docker/Dockerfile_cpu .
          docker push ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG
          docker tag ${{ env.REGISTRY }}/mybigpai/pairag:$IMAGE_TAG ${{ env.TEST_REGISTRY }}/mybigpai/pai-rag:$TEST_IMAGE_TAG
          docker push ${{ env.TEST_REGISTRY }}/mybigpai/pai-rag:$TEST_IMAGE_TAG

      - name: Free disk space
        run: |
          docker system prune -a -f
