[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pairag-file"
version = "2.1.38"
description = "PAI-RAG file processing library."
authors = []
readme = "README.md"
packages = [
  {include = "pairag/file"}
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
llama-index-core = "^0.14.8"
llama-index-llms-openai = "^0.6.10"
llama-index-llms-openai-like = "^0.5.3"
pydantic = "^2.7.0"
alibabacloud-oss-v2 = "^1.2.5"
torch = "^2.6.0"
transformers = "4.51.3"
modelscope = "^1.16.0"
bs4 = "^0.0.2"
anyio = "^4.6.2.post1"
numpy = "^1.26.4"
loguru = "^0.7.3"
python-docx = "^1.2.0"
mistletoe = "^1.4.0"
python-pptx = "^1.0.2"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
markdown = "^3.8.2"
docx2txt = "^0.9"
markdownify = "^1.2.0"
rapidfuzz = "^3.14.3"
fastpdf4llm = "^0.1.5"
tabulate = "^0.9.0"
alibabacloud-iqs20241111 = "1.1.3"
pandas = "^2.2.3"
charset-normalizer = "^3.4.4"
pillow = "^12.1.0"
pillow-heif = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
pre-commit = "^3.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
