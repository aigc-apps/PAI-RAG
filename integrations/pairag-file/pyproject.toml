[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pairag-file"
version = "2.0.16"
requires-python = ">=3.11,<3.13"

[tool.poetry]
name = "pairag-file"
version = "2.0.16"
description = "PAI-RAG file processing library."
authors = []
readme = "README.md"
packages = [
  {include = "pairag/file"}
]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.13"
fastapi = "0.115.2"
uvicorn = "^0.29.0"
llama-index-core = "^0.12.12"
llama-index-llms-openai = "0.3.44"
pydantic = "^2.7.0"
pytest = "^8.1.1"
sentencepiece = "^0.2.0"
oss2 = "^2.18.5"
torch = "^2.6.0"
torchvision = "^0.21.0"
transformers = "4.51.3"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
gunicorn = "^22.0.0"
modelscope = "^1.16.0"
pre-commit = "^3.8.0"
bs4 = "^0.0.2"
httpx = "0.27.0"
peft = "^0.12.0"
anyio = "^4.6.2.post1"
func-timeout = "^4.3.5"
dashtext = "^0.0.7"
numpy = "1.26.4"
loguru = "^0.7.3"
pymupdf4llm = "0.0.17"
chardet = "^5.2.0"
python-docx = "^1.2.0"
mistletoe = "^1.4.0"
html2text = "^2025.4.15"
mineru = {version = "^2.1.10", extras = ["core"]}
python-pptx = "^1.0.2"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
markdown = "^3.8.2"
docx2txt = "^0.9"
fuzzywuzzy = "^0.18.0"
python-levenshtein = "^0.27.1"
tabulate = "^0.9.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
