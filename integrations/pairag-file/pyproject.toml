[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pairag-file"
version = "1.2.2"
description = "PAI-RAG file processing library."
authors = []
readme = "README.md"
packages = [
  {include = "pairag/file"}
]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.12"
llama-index-core = "^0.12.27"
llama-index-readers-file = "^0.4.3"
docx2txt = "^0.8"
pydantic = "^2.7.0"
oss2 = "^2.18.5"
torch = "2.2.2"
transformers = "4.51.3"
openpyxl = "^3.1.2"
xlrd = "^2.0.1"
markdown = "^3.6"
chardet = "^5.2.0"
modelscope = "^1.16.0"
pre-commit = "^3.8.0"
peft = "^0.12.0"
python-pptx = "^1.0.2"
aspose-slides = "^24.10.0"
datasketch = "^1.6.5"
anyio = "^4.6.2.post1"
mistletoe = "^1.4.0"
html2text = "^2024.2.26"
rapidfuzz = "^3.13.0"
python-docx = "^1.1.2"
numpy = "1.26.4"
loguru = "^0.7.3"
llama-index-multi-modal-llms-openai = "^0.5.0"
pytest = "^8.3.5"
magic-pdf = {version = "1.3.10", extras = ["full"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
